<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" role="img" aria-labelledby="title desc">
<title id="title">Pi model-Bash integration: OpenShell credential and process flow</title>
<desc id="desc">Pi, user Bash entered with ! or !!, and the OpenShell gateway stay on the host. Only model-requested Bash is routed into the sandbox. The trusted supervisor and proxy run inside the Docker container and receive real provider credentials. Restricted model command processes receive opaque credential placeholders. The proxy checks policy and credential binding before adding real credentials to permitted outbound requests. Separately, explicitly shared project files are readable as-is, including credentials in project npmrc files.</desc>
<defs>
  <marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker>
  <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b91c1c"/></marker>
  <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
  <style>text{font-family:DejaVu Sans,sans-serif;fill:#172033}.heading{font-size:25px;font-weight:700}.title{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.secret{fill:#b91c1c}.opaque{fill:#1d4ed8}.muted{fill:#475569}.box{stroke-width:2}.arrow{fill:none;stroke-width:3}</style>
</defs>
<rect width="1080" height="1000" fill="#ffffff"/>
<text id="diagram-title" x="30" y="36" class="heading">Where credentials go in the Pi model-Bash integration</text>
<text x="30" y="64" class="body muted">OpenShell v0.0.116 / local Docker — only model-requested Bash runs in the sandbox.</text>
<rect x="25" y="90" width="420" height="710" rx="18" fill="#eff6ff" stroke="#2563eb" class="box"/>
<text x="45" y="128" class="title opaque">HOST</text>
<rect x="505" y="90" width="550" height="710" rx="18" fill="#fffbeb" stroke="#d97706" class="box"/>
<text x="525" y="128" class="title" fill="#92400e">DOCKER CONTAINER</text>
<text x="525" y="156" class="small muted">Trusted supervisor and restricted commands coexist here.</text>
<rect x="50" y="170" width="370" height="100" rx="12" fill="#ffffff" stroke="#2563eb" class="box"/>
<text x="235" y="204" text-anchor="middle" class="title">Pi + extension</text>
<text x="235" y="232" text-anchor="middle" class="body">Pi session + file tools stay on host</text>
<text x="235" y="255" text-anchor="middle" class="small muted">Only model Bash is routed through the SDK</text>
<path d="M235 277 V305" stroke="#475569" class="arrow" marker-end="url(#gray)"/>
<rect x="50" y="312" width="370" height="90" rx="12" fill="#ffffff" stroke="#64748b" class="box"/>
<text x="235" y="344" text-anchor="middle" class="title">Configured declarations</text>
<text x="235" y="372" text-anchor="middle" class="body">Extension reads selected host secrets</text>
<text x="235" y="393" text-anchor="middle" class="small muted">Not automatic discovery of every credential</text>
<path d="M235 408 V448" stroke="#b91c1c" class="arrow" marker-end="url(#red)"/>
<text x="254" y="435" class="small muted">SDK calls over mTLS</text>
<rect x="50" y="455" width="370" height="115" rx="12" fill="#ffffff" stroke="#2563eb" class="box"/>
<text x="235" y="490" text-anchor="middle" class="title">1. Private gateway</text>
<text x="235" y="520" text-anchor="middle" class="body">Stores policy and provider state</text>
<text x="235" y="546" text-anchor="middle" class="body">Starts and configures the sandbox</text>
<rect x="50" y="580" width="370" height="58" rx="12" fill="#ffffff" stroke="#64748b" class="box"/>
<text x="235" y="604" text-anchor="middle" class="body">User Bash (! / !!) → host</text>
<text x="235" y="628" text-anchor="middle" class="small muted">Uses the normal host environment</text>
<path d="M425 505 H482 V435 H540" stroke="#b91c1c" class="arrow" marker-end="url(#red)"/>
<text x="480" y="412" text-anchor="middle" class="small muted">mTLS</text>
<rect x="545" y="330" width="465" height="190" rx="12" fill="#fff1f2" stroke="#b91c1c" class="box"/>
<text x="777" y="364" text-anchor="middle" class="title">2. Supervisor / policy proxy</text>
<text x="777" y="391" text-anchor="middle" class="body secret">Trusted; root; real credentials available here</text>
<text x="777" y="424" text-anchor="middle" class="body">Checks network policy + credential binding</text>
<text x="777" y="454" text-anchor="middle" class="body">Adds real credentials to allowed requests</text>
<text x="777" y="487" text-anchor="middle" class="body">Starts and restricts command processes</text>
<path d="M670 604 V527" stroke="#2563eb" class="arrow" marker-end="url(#blue)"/>
<text x="651" y="555" text-anchor="end" class="small opaque">request with</text>
<text x="651" y="575" text-anchor="end" class="small opaque">placeholder</text>
<path d="M865 527 V604" stroke="#2563eb" class="arrow" marker-end="url(#blue)"/>
<text x="882" y="555" class="small opaque">start +</text>
<text x="882" y="575" class="small opaque">opaque env</text>
<rect x="545" y="610" width="465" height="145" rx="12" fill="#f0fdf4" stroke="#15803d" class="box"/>
<text x="777" y="645" text-anchor="middle" class="title">3. Restricted model commands</text>
<text x="777" y="674" text-anchor="middle" class="body">model Bash and available workload tools</text>
<text x="777" y="705" text-anchor="middle" class="body opaque">Provider environment: opaque placeholders</text>
<text x="777" y="733" text-anchor="middle" class="small muted">No UID, tool-version or project-write guarantee</text>
<rect x="50" y="650" width="370" height="105" rx="12" fill="#fff1f2" stroke="#b91c1c" class="box"/>
<text x="235" y="684" text-anchor="middle" class="title">Shared project files</text>
<text x="235" y="712" text-anchor="middle" class="body secret">Project .npmrc / .env values stay raw</text>
<text x="235" y="737" text-anchor="middle" class="small muted">No automatic secret redaction</text>
<path d="M425 701 H539" stroke="#b91c1c" class="arrow" marker-end="url(#red)"/>
<text x="481" y="682" text-anchor="middle" class="small secret">RAW files</text>
<text x="481" y="725" text-anchor="middle" class="small muted">if granted</text>
<path d="M1014 443 H1035 V887 H1015" stroke="#b91c1c" class="arrow" marker-end="url(#red)"/>
<rect x="545" y="840" width="465" height="95" rx="12" fill="#faf5ff" stroke="#7e22ce" class="box"/>
<text x="777" y="875" text-anchor="middle" class="title">4. Allowed Git / registry endpoint</text>
<text x="777" y="906" text-anchor="middle" class="body secret">Receives the real credential</text>
<text x="45" y="850" class="title">Two separate decisions</text>
<text x="45" y="881" class="body">A. Who can select credentials?</text>
<text x="45" y="911" class="body">B. Which processes may know them?</text>
<path d="M45 960 H82" stroke="#b91c1c" class="arrow" marker-end="url(#red)"/>
<text x="95" y="966" class="small">Real secrets / raw files</text>
<path d="M335 960 H372" stroke="#2563eb" class="arrow" marker-end="url(#blue)"/>
<text x="385" y="966" class="small">Opaque placeholders / requests</text>
<text x="715" y="966" class="small muted">Simplified data flow, not every RPC.</text>
</svg>
