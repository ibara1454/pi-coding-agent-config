[test]
preload = ["./test/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["**/test/setup.ts", "**/*-test-fixtures.ts", "**/apps/sandbox/**"]
# Per-file floors; keep headroom for incremental tests rather than chasing full coverage.
coverageThreshold = { lines = 0.8, functions = 0.8 }
