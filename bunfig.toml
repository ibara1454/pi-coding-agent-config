[test]
preload = ["./test/setup.ts"]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/test/setup.ts",
  "**/apps/**/test/*.helper.ts",
]
# Per-file floors; keep headroom for incremental tests rather than chasing full coverage.
coverageThreshold = 0.95

[install.scopes]
"@nvidia" = { url = "https://npm.pkg.github.com/", token = "$NVIDIA_NPM_TOKEN" }
