# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
registries:
  npm-public:
    type: npm-registry
    url: https://registry.npmjs.org
    token: ${{ secrets.NPM_READ_TOKEN }}
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.NVIDIA_NPM_TOKEN}}
updates:
  - package-ecosystem: "bun"
    # The root Bun workspace includes apps/* and libs/*, so shared
    # dependencies are updated across their manifests in one PR.
    directory: "/"
    registries:
      # Workaround: keep public packages on npmjs instead of GitHub Packages.
      # shortcut: public-first inference, remove when Dependabot's Bun updater honors scopes.
      - npm-public
      - github-packages
    schedule:
      interval: "daily"
    groups:
      earendil-works:
        patterns:
          - "@earendil-works/*"
